# Nginx for Off-Air Memory TV
#
# The live config used by Docker lives in `www/nginx.conf`.
# This file is a draft/copy; keep it in sync with www when editing.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name tv.mifista.eu;

    root /usr/share/nginx/html;
    index index.html;

    set $oam_upstream server:3000;

    location /api/ {
        proxy_pass http://$oam_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location /static/ {
        proxy_pass http://$oam_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://$oam_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /stream/ {
        alias /data/stream/;
        add_header Cache-Control no-cache;
        add_header Access-Control-Allow-Origin * always;

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/iso.segment m4s;
            application/octet-stream m4s;
        }

        autoindex off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
